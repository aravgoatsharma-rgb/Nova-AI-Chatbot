
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | NovaAI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #f5f6f8;
    color: #171717;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: #ffffff;
    padding: 38px 30px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 18px 55px rgba(0,0,0,0.08);
    border-radius: 20px;
}

.logo {
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    margin-bottom: 10px;
    letter-spacing: -1px;
}

.logo img {
    display: block;
    width: 84px;
    height: 84px;
    object-fit: contain;
    margin: 0 auto;
}

.logo span {
    color: #8b5cf6;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 32px;
    font-size: 14px;
}

h2 {
    font-size: 24px;
    margin-bottom: 22px;
}

label {
    display: block;
    margin-bottom: 9px;
    color: #374151;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    background: #ffffff;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    color: #171717;
    outline: none;
    margin-bottom: 18px;
    font-size: 14px;
}

input:focus {
    border-color: #8b5cf6;
}

.forgot {
    display: block;
    text-align: right;
    color: #a78bfa;
    font-size: 13px;
    text-decoration: none;
    margin-top: -7px;
    margin-bottom: 20px;
}

button {
    width: 100%;
    min-height: 48px;
    border: none;
    border-radius: 9px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: 0.2s;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.signin {
    background: #8b5cf6;
    color: white;
}

.signin:hover {
    background: #7543df;
}

.social-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
}

.social-btn {
    padding: 12px;
    font-size: 14px;
}

.google-btn {
    background: #ffffff;
    color: #222222;
    border: 1px solid #dddddd;
}

.google-btn:hover {
    background: #eeeeee;
}

.github-btn {
    background: #ffffff;
    color: #24292f;
    border: 1px solid #d1d5db;
}

.github-btn:hover {
    background: #f3f4f6;
}

.discord-btn {
    background: #ffffff;
    color: #5865F2;
    border: 1px solid #d1d5db;
}

.discord-btn:hover {
    background: #f3f4f6;
}

.social-btn svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
}

.divider {
    display: flex;
    align-items: center;
    gap: 13px;
    color: #6b7280;
    margin-top: 23px;
    font-size: 12px;
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #e5e7eb;
}

.bottom {
    text-align: center;
    color: #6b7280;
    margin-top: 25px;
    font-size: 14px;
}

.bottom a {
    color: #a78bfa;
    text-decoration: none;
    font-weight: bold;
}

#message {
    margin-top: 17px;
    font-size: 13px;
    text-align: center;
    color: #ff7777;
    line-height: 1.5;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="applogo.jpg" alt="NovaAI logo">
    </div>

    <p class="subtitle">Your AI. Your World.</p>

    <h2>Welcome Back</h2>

    <form id="loginForm">

        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <a href="#" class="forgot" id="forgotPassword">
            Forgot password?
        </a>

        <button type="submit" class="signin" id="signinBtn">
            Sign In
        </button>

    </form>

    <div class="divider">OR CONTINUE WITH</div>

    <div class="social-buttons">

        <!-- GOOGLE LOGIN -->

        <button class="social-btn google-btn" id="googleBtn" type="button">

            <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path fill="#FFC107" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11c-.5 2.5-1.9 4.6-4 6v5h6.5c3.8-3.5 6.1-8.6 6.1-14.7z"/>
                <path fill="#FF3D00" d="M24 44c5.4 0 9.9-1.8 13.2-4.8l-6.5-5c-1.8 1.2-4 1.9-6.7 1.9-5.2 0-9.6-3.5-11.2-8.2H6.1v5.2C9.4 39.6 16.2 44 24 44z"/>
                <path fill="#4CAF50" d="M12.8 27.9a12 12 0 0 1 0-7.8v-5.2H6.1a20 20 0 0 0 0 18.2l6.7-5.2z"/>
                <path fill="#1976D2" d="M24 11.9c2.9 0 5.5 1 7.6 3.1l5.7-5.7C33.9 6 29.4 4 24 4 16.2 4 9.4 8.4 6.1 14.9l6.7 5.2c1.6-4.7 6-8.2 11.2-8.2z"/>
            </svg>

            Continue with Google

        </button>

        <!-- GITHUB LOGIN -->

        <button class="social-btn github-btn" id="githubBtn" type="button">

            <svg viewBox="0 0 24 24" fill="currentColor"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="M12 .9a11.1 11.1 0 0 0-3.5 21.6c.55.1.75-.24.75-.53v-2.08c-3.06.67-3.71-1.3-3.71-1.3-.5-1.28-1.23-1.62-1.23-1.62-1-.68.08-.67.08-.67 1.1.08 1.68 1.13 1.68 1.13.98 1.68 2.57 1.2 3.2.92.1-.72.38-1.2.7-1.48-2.45-.28-5.03-1.22-5.03-5.46 0-1.2.43-2.19 1.14-2.96-.12-.28-.5-1.4.11-2.92 0 0 .93-.3 3.05 1.13a10.6 10.6 0 0 1 5.55 0c2.11-1.43 3.04-1.13 3.04-1.13.61 1.52.23 2.64.11 2.92.71.77 1.14 1.76 1.14 2.96 0 4.25-2.58 5.18-5.04 5.45.4.35.75 1.02.75 2.06v3.05c0 .29.2.64.76.53A11.1 11.1 0 0 0 12 .9z"/>
            </svg>

            Continue with GitHub

        </button>

        <!-- DISCORD LOGIN -->

        <button class="social-btn discord-btn" id="discordBtn" type="button">

            <svg viewBox="0 0 24 24" fill="currentColor"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="M19.7 5.3A18.4 18.4 0 0 0 15.2 4l-.6 1.2a16.7 16.7 0 0 0-5.2 0L8.8 4a18.4 18.4 0 0 0-4.5 1.3C1.5 9.5.7 13.6 1.1 17.7a18.5 18.5 0 0 0 5.5 2.8l1.2-2a12 12 0 0 1-1.9-.9l.5-.4a13.2 13.2 0 0 0 11.2 0l.5.4a12 12 0 0 1-1.9.9l1.2 2a18.5 18.5 0 0 0 5.5-2.8c.5-4.8-.8-8.8-3.2-12.4ZM8.6 14.8c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm6.8 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/>
            </svg>

            Continue with Discord

        </button>

    </div>

    <p id="message"></p>

    <div class="bottom">
        Don't have an account?
        <a href="register.html">Create Account</a>
    </div>

</div>

<script>

// SUPABASE CONNECTION

const SUPABASE_URL =
"https://lcitadmsgfwxemvcyaex.supabase.co";

const SUPABASE_KEY =
"sb_publishable_0J0LMASleqkhThJP4dT8Kg_NaL3RL06";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// REDIRECT URL

const HOME_URL = new URL(
    "home.html",
    window.location.href
).href;

// MESSAGE

function showMessage(message, success = false) {

    const box = document.getElementById("message");

    box.textContent = message;

    box.style.color = success
        ? "#16803d"
        : "#dc2626";

}

// SOCIAL LOGIN FUNCTION

async function socialLogin(provider, buttonId, buttonText, options = {}) {

    const button = document.getElementById(buttonId);

    button.disabled = true;
    button.textContent = "Connecting...";

    showMessage("");

    try {

        const { error } = await db.auth.signInWithOAuth({

            provider: provider,

            options: {
                redirectTo: HOME_URL,
                ...options
            }

        });

        if (error) throw error;

    } catch (error) {

        showMessage(error.message);

        button.disabled = false;
        button.textContent = buttonText;

    }

}

// GOOGLE LOGIN

document.getElementById("googleBtn")
.addEventListener("click", () => {

    socialLogin(
        "google",
        "googleBtn",
        "Continue with Google"
    );

});

// GITHUB LOGIN

document.getElementById("githubBtn")
.addEventListener("click", () => {

    socialLogin(
        "github",
        "githubBtn",
        "Continue with GitHub",
        {
            scopes: "user:email"
        }
    );

});

// DISCORD LOGIN

document.getElementById("discordBtn")
.addEventListener("click", () => {

    socialLogin(
        "discord",
        "discordBtn",
        "Continue with Discord"
    );

});

// EMAIL PASSWORD LOGIN

document.getElementById("loginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const button =
        document.getElementById("signinBtn");

    button.disabled = true;
    button.textContent = "Signing in...";

    showMessage("");

    try {

        const { data, error } =
        await db.auth.signInWithPassword({

            email: email,
            password: password

        });

        if (error) throw error;

        if (data.session) {

            window.location.replace(HOME_URL);

        }

    } catch (error) {

        showMessage(error.message);

        button.disabled = false;
        button.textContent = "Sign In";

    }

});

// FORGOT PASSWORD

document.getElementById("forgotPassword")
.addEventListener("click", async function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    if (!email) {

        showMessage("Please enter your email address first.");

        return;

    }

    try {

        const { error } =
        await db.auth.resetPasswordForEmail(email, {

            redirectTo: new URL(
                "login.html",
                window.location.href
            ).href

        });

        if (error) throw error;

        showMessage(
            "Password reset email sent! Check your inbox.",
            true
        );

    } catch (error) {

        showMessage(error.message);

    }

});

// CHECK EXISTING SESSION

async function checkSession() {

    const { data, error } = await db.auth.getSession();

    if (!error && data.session) {

        window.location.replace(HOME_URL);

    }

}

checkSession();

</script>

</body>
</html>
