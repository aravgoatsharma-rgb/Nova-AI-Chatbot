
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | NovaAI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg:#08080d; --card:#11111b; --text:#fff;
    --muted:#9999ad; --border:#29293a; --input:#0b0b13;
    --purple:#a855f7;
}
body.light {
    --bg:#f4f2fa; --card:#fff; --text:#171321;
    --muted:#777184; --border:#e4deed; --input:#f8f6fc;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body {
    min-height:100vh; background:var(--bg); color:var(--text);
    display:flex; justify-content:center; align-items:center;
    padding:25px; transition:.3s;
}
.container { width:100%; max-width:440px; text-align:center; }
.logo { font-size:34px; font-weight:bold; margin-bottom:10px; }
.logo span { color:var(--purple); }
.subtitle { color:var(--muted); font-size:14px; margin-bottom:28px; }
.card {
    background:var(--card); border:1px solid var(--border);
    border-radius:20px; padding:32px;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}
h2 { font-size:25px; margin-bottom:8px; }
.description { color:var(--muted); font-size:13px; margin-bottom:25px; }
.input-group { text-align:left; margin-bottom:17px; }
.input-group label {
    display:block; font-size:13px; margin-bottom:8px; color:var(--muted);
}
.input-group input {
    width:100%; padding:14px; border-radius:10px;
    border:1px solid var(--border); background:var(--input);
    color:var(--text); outline:none; font-size:14px;
}
.input-group input:focus { border-color:var(--purple); }
.password-box { position:relative; }
.password-box input { padding-right:65px; }
.show-password {
    position:absolute; right:13px; top:50%; transform:translateY(-50%);
    border:0; background:none; color:var(--purple); cursor:pointer;
}
.primary-btn,.google-btn {
    width:100%; padding:15px; border-radius:10px;
    font-size:14px; cursor:pointer;
}
.primary-btn {
    border:0; background:linear-gradient(90deg,#9333ea,#c084fc);
    color:white; font-weight:bold; margin-top:8px;
}
.primary-btn:disabled { opacity:.6; cursor:wait; }
.divider {
    display:flex; align-items:center; gap:12px;
    color:var(--muted); font-size:12px; margin:23px 0;
}
.divider:before,.divider:after {
    content:""; height:1px; background:var(--border); flex:1;
}
.google-btn {
    background:transparent; border:1px solid var(--border); color:var(--text);
}
.google-icon { color:#4285F4; font-weight:bold; margin-right:8px; }
.bottom-text { margin-top:23px; font-size:13px; color:var(--muted); }
.bottom-text a,.back-link {
    color:var(--purple); text-decoration:none; font-weight:bold;
}
.back-link { display:inline-block; margin-top:22px; font-size:13px; }
.theme-btn {
    position:fixed; top:20px; right:20px; padding:10px 14px;
    border:1px solid var(--border); border-radius:20px;
    background:var(--card); color:var(--text); cursor:pointer;
}
.message {
    display:none; padding:12px; border-radius:8px;
    font-size:13px; margin-bottom:15px; text-align:left;
    background:rgba(168,85,247,.12); color:var(--purple);
    overflow-wrap:anywhere;
}
@media(max-width:480px) { .card { padding:25px 20px; } }
</style>
</head>

<body>
<button class="theme-btn" id="themeButton" onclick="toggleTheme()">☀ Light</button>

<div class="container">
    <div class="logo">Nova<span>AI</span></div>
    <p class="subtitle">Your intelligent world starts here.</p>

    <div class="card">
        <h2>Create Account</h2>
        <p class="description">Join NovaAI and explore what's possible.</p>

        <div class="message" id="message"></div>

        <form id="registerForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input id="username" type="text" placeholder="Enter your username"
                    minlength="3" maxlength="30" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-box">
                    <input id="password" type="password"
                        placeholder="Create a password" minlength="8" required>
                    <button type="button" class="show-password"
                        onclick="togglePassword('password',this)">Show</button>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-box">
                    <input id="confirmPassword" type="password"
                        placeholder="Enter password again" minlength="8" required>
                    <button type="button" class="show-password"
                        onclick="togglePassword('confirmPassword',this)">Show</button>
                </div>
            </div>

            <button type="submit" class="primary-btn" id="registerButton">
                Create Account
            </button>
        </form>

        <div class="divider">OR</div>

        <button class="google-btn" onclick="googleRegister()">
            <span class="google-icon">G</span> Continue with Google
        </button>

        <p class="bottom-text">
            Already have an account? <a href="login.html">Sign in</a>
        </p>
    </div>

    <a href="index.html" class="back-link">← Back to Home</a>
</div>

<script>
const SUPABASE_URL = "https://lcitadmsgfwxemvcyaex.supabase.co";
const SUPABASE_KEY = "sb_publishable_0J0LMASleqkhThJP4dT8Kg_NaL3RL06";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const HOME_URL = new URL("home.html", window.location.href).href;

function showMessage(text) {
    const box = document.getElementById("message");
    box.textContent = text;
    box.style.display = "block";
}

function toggleTheme() {
    document.body.classList.toggle("light");
    const light = document.body.classList.contains("light");
    localStorage.setItem("novaai-theme", light ? "light" : "dark");
    document.getElementById("themeButton").textContent =
        light ? "☾ Dark" : "☀ Light";
}

if (localStorage.getItem("novaai-theme") === "light") {
    document.body.classList.add("light");
    document.getElementById("themeButton").textContent = "☾ Dark";
}

function togglePassword(id, button) {
    const field = document.getElementById(id);
    field.type = field.type === "password" ? "text" : "password";
    button.textContent = field.type === "password" ? "Show" : "Hide";
}

document.getElementById("registerForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const button = document.getElementById("registerButton");
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (username.length < 3) {
        showMessage("Username must contain at least 3 characters.");
        return;
    }

    if (password.length < 8) {
        showMessage("Password must contain at least 8 characters.");
        return;
    }

    if (password !== confirmPassword) {
        showMessage("Passwords do not match.");
        return;
    }

    button.disabled = true;
    button.textContent = "Creating account...";

    try {
        const { data, error } = await db.auth.signUp({
            email,
            password,
            options: {
                data: { username },
                emailRedirectTo: HOME_URL
            }
        });

        if (error) throw error;

        if (data.session) {
            window.location.href = HOME_URL;
        } else {
            showMessage("Account created. Check your email if confirmation is required before signing in.");
        }
    } catch (error) {
        showMessage(error.message || "Registration failed.");
    } finally {
        button.disabled = false;
        button.textContent = "Create Account";
    }
});

async function googleRegister() {
    try {
        const { error } = await db.auth.signInWithOAuth({
            provider: "google",
            options: { redirectTo: HOME_URL }
        });
        if (error) throw error;
    } catch (error) {
        showMessage(error.message || "Google registration failed.");
    }
}
</script>
</body>
</html>
